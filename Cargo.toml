[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/store",
    "crates/client",
    "crates/daemon",
    "crates/cli",
    "crates/testkit",
    "crates/login",
    "crates/secrets",
]
# the patched keepass-rs is a dependency, not ours to lint or format; the
# window (app/src-tauri) is its own Cargo project, so building and testing
# this workspace never needs webkit2gtk
exclude = ["vendor", "app"]

[workspace.package]
version = "0.3.1-beta"
edition = "2024"
license = "MIT"
repository = "https://github.com/prj786/ewe-safe"
rust-version = "1.90"

[workspace.dependencies]
safe-core = { path = "crates/core" }
safe-store = { path = "crates/store" }
safe-client = { path = "crates/client" }
safe-testkit = { path = "crates/testkit" }
safe-login = { path = "crates/login" }
safe-secrets = { path = "crates/secrets" }
# `_merge` only for the phase-0 merge spike: Safe merges itself (SPIKE-0 §2)
keepass = { version = "0.15.2", features = ["save_kdbx4", "_merge"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# key derivation is unbearably slow unoptimised; tests open real files
[profile.dev.package."*"]
opt-level = 2

# keepass-rs 0.15.2 with one fix: an attachment leaves the database only when
# no entry or history version still uses it (vendor/keepass/PATCHED.md).
# Drop this once upstream has the fix.
[patch.crates-io]
keepass = { path = "vendor/keepass" }
