[package]
name = "ewe-safe"
description = "ewe-safe's CLI: JSON verbs over the daemon's socket"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "ewe-safe"
path = "src/main.rs"

[dependencies]
safe-core.workspace = true
safe-client.workspace = true
serde_json = "1"
zeroize = "1"
# the master password from a terminal, without echo
rpassword = "7"

[dev-dependencies]
safe-testkit.workspace = true
# checking the daemon's passkey answers (tests/passkeys.rs)
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "pem", "std"] }
ed25519-dalek = { version = "3", default-features = false, features = ["fast", "zeroize", "pem"] }
sha2 = "0.11"
