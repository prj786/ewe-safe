[package]
name = "safe-secrets"
description = "ewe-safe as the keyring: the Secret Service (org.freedesktop.secrets) on the session bus, its items sealed by this computer's key (docs/SYSTEM.md §3)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "safe_secrets"

[dependencies]
safe-login.workspace = true
zbus = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
zeroize = "1"
getrandom = "0.4"
# dh-ietf1024-sha256-aes128-cbc-pkcs7: the versions keepass-rs already brings
crypto-bigint = { version = "0.7", default-features = false }
aes = "0.9"
cbc = { version = "0.2", features = ["alloc"] }
hmac = "0.13"
sha2 = "0.11"

[dev-dependencies]
tempfile = "3"
