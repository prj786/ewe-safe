[package]
name = "safe-store"
description = "ewe-safe's places: where the file lives and each place's conflict guard"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "safe_store"

[dependencies]
safe-core.workspace = true
keepass.workspace = true
# blocking HTTP for WebDAV; rustls, with the system's trust store so a
# self-hosted server's own CA works
ureq = { version = "3.4", default-features = false, features = ["rustls", "platform-verifier", "gzip"] }
url = "2"
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
zeroize = "1"

[dev-dependencies]
safe-testkit.workspace = true
# the cheap key derivation tests use (`argon2::Version`)
rust-argon2 = "3"
