[package]
name = "ewe-safed"
description = "ewe-safe's daemon: holds the unlocked safe, locks it, syncs it"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "ewe-safed"
path = "src/main.rs"

[dependencies]
safe-core.workspace = true
safe-store.workspace = true
keepass.workspace = true
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha2 = "0.11"
zeroize = "1"
libc = "0.2"
# logind's LockedHint and PrepareForSleep (the screen locks, the lid closes)
zbus = "5"
signal-hook = "0.3"
# a new passkey login's website, from the page's origin
url = "2"

